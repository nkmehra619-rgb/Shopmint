name: Install HeyMyBuddy storefront source
on:
  push:
    branches: [heymybuddy-storefront]
    paths:
      - ".storefront-source.b64"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: heymybuddy-storefront
          persist-credentials: true
      - name: Extract verified storefront archive
        run: |
          python - <<'PY'
          import base64, zipfile, pathlib
          archive = pathlib.Path(".storefront-source.b64")
          data = base64.b64decode(archive.read_text().strip(), validate=True)
          temp = pathlib.Path("/tmp/heymybuddy-source.zip")
          temp.write_bytes(data)
          with zipfile.ZipFile(temp) as z:
              for item in z.infolist():
                  target = pathlib.PurePosixPath(item.filename)
                  if target.is_absolute() or ".." in target.parts:
                      raise SystemExit("Unsafe archive path")
              z.extractall(".")
          archive.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install HeyMyBuddy storefront source"
          git push origin heymybuddy-storefront
